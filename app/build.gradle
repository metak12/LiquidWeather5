plugins {
    id 'com.android.application' version '8.3.0'
}

android {
    namespace 'com.dmitry.weatherwidget'
    compileSdk 35

    defaultConfig {
        applicationId "com.dmitry.weatherwidget"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.9.0'
}
